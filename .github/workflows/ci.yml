name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Julia 1.10 (x64)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1.10'
          arch: x64
      - uses: julia-actions/cache@v3
      - name: Instantiate from DarrylGamrothRegistry
        run: >-
          julia --startup-file=no --project=.
          -e 'using Pkg;
          Pkg.Registry.add("General");
          Pkg.Registry.add(Pkg.RegistrySpec(url="https://github.com/DarrylGamroth/PackageRegistry.git"));
          Pkg.instantiate()'
      - name: Run tests
        run: julia --startup-file=no --project=. -e 'using Pkg; Pkg.test()'

  coverage:
    name: Julia 1 with coverage
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1'
      - uses: julia-actions/cache@v3
      - name: Instantiate from DarrylGamrothRegistry
        run: >-
          julia --startup-file=no --project=.
          -e 'using Pkg;
          Pkg.Registry.add("General");
          Pkg.Registry.add(Pkg.RegistrySpec(url="https://github.com/DarrylGamroth/PackageRegistry.git"));
          Pkg.instantiate()'
      - name: Run tests with coverage
        run: >-
          julia --startup-file=no --project=.
          -e 'using Pkg; Pkg.test(; coverage=true)'
      - uses: julia-actions/julia-processcoverage@v1
        with:
          directories: src
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: lcov.info
          fail_ci_if_error: true
          use_oidc: true
      - name: Enforce per-file coverage
        run: >-
          python3 .github/scripts/check_file_coverage.py lcov.info
          --minimum 80
          --ignore-prefix src/generated/
